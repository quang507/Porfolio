<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Không tìm thấy trang · Lê Bá Duy Quang</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text x='50' y='73' font-size='68' font-family='Inter,Helvetica,Arial' font-weight='600' text-anchor='middle' fill='%23fafafa'>Q</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      background: #EEEDEC;
      color: #000000;
      font-family: Inter, Helvetica, Arial, sans-serif;
    }
    main { width: 100%; max-width: 560px; }
    .code { font-size: 14px; font-weight: 600; color: #6B6B6A; margin-bottom: 12px; }
    h1 { font-size: clamp(40px, 9vw, 72px); font-weight: 600; letter-spacing: -0.04em; line-height: 0.95; margin-bottom: 20px; }
    p { font-size: 17px; font-weight: 500; line-height: 1.5; color: #4A4A49; margin-bottom: 28px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    a {
      display: inline-flex;
      align-items: center;
      padding: 12px 22px;
      border: 1px solid rgba(0, 0, 0, 0.85);
      border-radius: 1000px;
      font-size: 14px;
      font-weight: 600;
      color: #000000;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease;
    }
    a.primary, a:hover { background: #000000; color: #FAFAFA; }
    a:focus-visible { outline: 2px solid #000000; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="code">Lỗi 404</div>
    <h1>Trang này không có.</h1>
    <p>Có thể đường dẫn bị gõ sai, hoặc trang đã được đổi tên.</p>
    <div class="actions">
      <a class="primary" data-page="index.html" href="index.html">Về trang chủ</a>
      <a data-page="projects.html" href="projects.html">Xem dự án</a>
      <a data-page="contact.html" href="contact.html">Liên hệ</a>
    </div>
  </main>

  <script>
    // Trang 404 có thể hiện ở bất kỳ đường dẫn nào, nên link phải tính từ gốc của site.
    (function () {
      var base = location.pathname.indexOf('/Porfolio/') === 0 ? '/Porfolio/' : '/';
      document.querySelectorAll('a[data-page]').forEach(function (a) {
        a.setAttribute('href', base + a.getAttribute('data-page'));
      });
    })();
  </script>
</body>
</html>
